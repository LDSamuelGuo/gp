
steps:
  # Optional: show what we’re building (helps debug wrong paths)
  - name: gcr.io/cloud-builders/bash
    entrypoint: bash
    args:
      - -c
      - |
        echo "PWD: $(pwd)"
        ls -la

  # Build the Docker image (context = repo root)
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/mygp-d8c00", "."]

images:
  - gcr.io/$PROJECT_ID/mygp-d8c00
